[package]
name = "craft-updater"
version = "1.0.0"
edition = "2021"
description = "Portable updater for PhotoCraft and VectorCraft (ArtCraft)"
authors = ["Bogdan"]
license = "MIT OR Apache-2.0"

[dependencies]
# Windows is the real target, so no x11/wayland here. They are added only for
# Linux below, which keeps both the native Windows build and a WSL cross-build clean.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = "2"
sha2 = "0.10"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Linux needs a windowing backend to build/run there (e.g. WSL with an X server);
# harmless for the Windows target, which never sees these.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

# Windows-only: tray icon, native toast notifications, and "launch at login".
[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
tauri-winrt-notification = "0.7"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
